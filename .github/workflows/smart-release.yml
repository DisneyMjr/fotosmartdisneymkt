name: Publicar versão FotoSmart (Windows, Linux e macOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão para publicar (ex.: 0.5.0). Deve coincidir com Cargo.toml."
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar versão
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Versao invalida. Use 0.3.0, por exemplo.' }
      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Instalar WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Criar MSI
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Verificar instalador
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist/release/*.msi -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw 'MSI nao encontrado em dist/release' }
          $files | Select-Object Name, Length
      - name: Disponibilizar MSI
        uses: actions/upload-artifact@v4
        with:
          name: FotoSmart-Windows-x64
          path: dist/release/*.msi
          if-no-files-found: error
          retention-days: 30

  linux:
    name: AppImage, DEB, RPM e TAR.GZ (x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      NFPM_VERSION: '2.47.0'
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Baixar fontes licenciadas do projeto
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts

      - name: Instalar dependencias Linux
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates pkg-config build-essential cmake clang libssl-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev desktop-file-utils appstream python3-yaml zsync
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: smart-linux-x64

      - name: Compilar e empacotar
        shell: bash
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        run: bash packaging/linux/package.sh

      - name: Conferir arquivos gerados
        shell: bash
        run: |
          ls -lh dist/release/
          test -n "$(find dist/release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find dist/release -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find dist/release -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$(find dist/release -maxdepth 1 -name '*.tar.gz' -print -quit)"
          sha256sum dist/release/* > dist/release/SHA256SUMS.txt

      - name: Disponibilizar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: FotoSmart-Linux-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS universal (Intel + Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Obter fontes licenciadas
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
      - name: Preparar compilador Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache de compilacao
        uses: Swatinem/rust-cache@v2
        with:
          key: fotosmart-macos-universal
      - name: Instalar dependencias macOS
        run: |
          brew install cmake pkg-config libheif
      - name: Compilar e empacotar aplicativo universal
        shell: bash
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        run: bash packaging/macos/package.sh --arch universal
      - name: Verificar pacote gerado
        shell: bash
        run: |
          ls -lh dist/release/
          test -n "$(find dist/release -maxdepth 1 -name 'FotoSmart-*-macos-universal.dmg' -print -quit)"
          shasum -a 256 dist/release/./*.dmg > dist/release/SHA256SUMS-macos.txt
      - name: Disponibilizar instalador macOS
        uses: actions/upload-artifact@v4
        with:
          name: FotoSmart-macOS-Universal
          path: |
            dist/release/*.dmg
            dist/release/*macos*.zip
            dist/release/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar instaladores
    runs-on: ubuntu-latest
    needs: [windows, linux, macos]
    timeout-minutes: 20
    steps:
      - name: Obter instaladores de todas as plataformas
        uses: actions/download-artifact@v4
        with:
          pattern: FotoSmart-*
          path: instaladores
          merge-multiple: true
      - name: Criar ou atualizar GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Formato de versao invalido' >&2
            exit 1
          fi
          TAG="v${TAG_VERSION}"
          mapfile -d '' -t FILES < <(find instaladores -type f \( -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.zip' -o -name 'SHA256SUMS*.txt' \) -print0)
          if (( ${#FILES[@]} == 0 )); then
            echo 'Nenhum instalador foi encontrado' >&2
            exit 1
          fi
          printf 'Arquivos encontrados: %s\n' "${#FILES[@]}"
          printf '  %s\n' "${FILES[@]}"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Atualizando Release existente: $TAG"
          else
            gh release create "$TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "FotoSmart $TAG" --notes "Instaladores Windows x64, Linux x64 e macOS universal. O DMG sem notarizacao pode exigir autorizacao manual no macOS."
          fi
          gh release upload "$TAG" "${FILES[@]}" --repo "$GH_REPO" --clobber
