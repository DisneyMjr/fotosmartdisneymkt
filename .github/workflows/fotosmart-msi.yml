name: Gerar MSI FotoSmart

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msi:
    name: Compilar e empacotar FotoSmart Windows x64
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Baixar codigo-fonte
        uses: actions/checkout@v4

      - name: Preparar Rust MSVC x64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache da compilacao Rust
        uses: Swatinem/rust-cache@v2

      - name: Instalar WiX Toolset 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix --version

      - name: Gerar MSI e versao portatil
        shell: pwsh
        run: |
          ./packaging/windows/package.ps1 -Arch x64

      - name: Publicar instalador para download
        uses: actions/upload-artifact@v4
        with:
          name: FotoSmart-Windows-x64
          path: |
            dist/release/*.msi
            dist/release/*-portable.zip
          if-no-files-found: error
          retention-days: 30
